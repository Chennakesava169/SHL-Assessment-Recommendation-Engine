<!DOCTYPE html>
<html>
<head>
    <title>SHL Assessment Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container text-center mt-5">
        <h1 class="mb-4">SHL Assessment Recommendation Engine</h1>
        <form method="POST">
            <input type="text" name="query" class="form-control mb-3" placeholder="Enter job role or skill">
            <button type="submit" class="btn btn-primary">Get Recommendation</button>
        </form>
        {% if recommendations %}
            <div class="mt-4">
                <h4>Recommended Assessments:</h4>
                <ul class="list-group">
                    {% for r in recommendations %}
                        <li class="list-group-item">{{ r }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    </div>
</body>
</html>
